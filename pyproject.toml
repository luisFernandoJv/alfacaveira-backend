[tool.poetry]
name = "foco-policial-backend"
version = "0.1.0"
description = "Backend do SaaS Foco Policial — preparação para concursos policiais"
authors = ["Foco Policial <dev@focopolicial.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
asyncpg = "^0.30.0"
alembic = "^1.13.3"
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"
email-validator = "^2.2.0"
pyjwt = "^2.9.0"
argon2-cffi = "^23.1.0"
redis = { extras = ["hiredis"], version = "^5.1.1" }
python-multipart = "^0.0.12"
structlog = "^24.4.0"
apscheduler = "^3.10.4"
prometheus-client = "^0.26.0"
httpx = "^0.27.0"
boto3 = "^1.43.76"
reportlab = "^4.2.5"
google-auth = ">=2.0.0,<3.0.0"
pandas = "^3.0.5"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.1"
mypy = "^1.13.0"
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
factory-boy = "^3.3.1"
testcontainers = {extras = ["postgres"], version = "^4.15.0"}
psycopg2-binary = "^2.9.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # permite Depends(...) como default de argumento (padrão FastAPI)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.models.*"
# Relationships e mapped_column geram falsos positivos comuns em SQLAlchemy 2;
# revisitar conforme o plugin oficial evolui.
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]